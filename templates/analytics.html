<!DOCTYPE html>
<html>

<head>

    <title>Fraud Analytics</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            background:#0f172a;
            color:white;
        }

        .container{
            padding:40px;
        }

        h1{
            text-align:center;
            margin-bottom:40px;
            font-size:45px;
        }

        .chart-box{
            background:#1e293b;
            padding:30px;
            border-radius:20px;
            width:80%;
            margin:auto;
            text-align:center;
        }

        .chart-box img{
            width:500px;
            background:white;
            padding:15px;
            border-radius:15px;
        }

        .stats{
            display:flex;
            justify-content:space-around;
            margin-top:40px;
        }

        .card{
            background:#111827;
            padding:25px;
            width:25%;
            border-radius:15px;
            text-align:center;
        }

        .card h2{
            font-size:40px;
        }

        .fraud{
            color:red;
        }

        .legit{
            color:green;
        }

        .btn{
            display:inline-block;
            margin-top:40px;
            padding:12px 25px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            border-radius:10px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Fraud Analytics</h1>

        <div class="chart-box">

            <h2>Fraud vs Legitimate Transactions</h2>

            <img src="{{ url_for('static', filename=chart) }}">

        </div>

        <div class="stats">

            <div class="card">
                <p>Fraud Transactions</p>
                <h2 class="fraud">{{ fraud }}</h2>
            </div>

            <div class="card">
                <p>Legitimate Transactions</p>
                <h2 class="legit">{{ legitimate }}</h2>
            </div>

            <div class="card">
                <p>Total Transactions</p>
                <h2>{{ total }}</h2>
            </div>

        </div>

        <center>

            <a href="/dashboard" class="btn">
                Back to Dashboard
            </a>

        </center>

    </div>

</body>

</html>
